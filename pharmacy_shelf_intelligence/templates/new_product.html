{% extends "base.html" %}{% block title %}Add product · Pharmacy Shelf{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">INVENTORY</div><h1>Add product & batch</h1><p class="muted">A product can have multiple batches with different expiry dates.</p></div></div>
<form method="post" class="form-card"><div class="form-grid">
<label>SKU / product code<input name="sku" required placeholder="MED-005"></label>
<label>Product name<input name="name" required placeholder="Medicine name"></label>
<label>Supplier<select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }} ({{ s.return_cutoff_days }} days cutoff)</option>{% endfor %}</select>{% if not suppliers %}<small>Add a supplier first.</small>{% endif %}</label>
<label>Batch code<input name="batch_code" placeholder="BATCH-001"></label>
<label>Quantity<input name="quantity" type="number" min="0" required value="10"></label>
<label>Expiry date<input name="expiry_date" type="date" required></label>
<label>Purchase price per unit (৳)<input name="purchase_price" type="number" step="0.01" min="0" value="0"></label>
<label>Selling price per unit (৳)<input name="selling_price" type="number" step="0.01" min="0" value="0"></label>
<label class="check"><input name="discount_allowed" type="checkbox"> Discounting is permitted for this product</label>
</div><button class="button primary" type="submit" {% if not suppliers %}disabled{% endif %}>Save product</button></form>{% endblock %}
